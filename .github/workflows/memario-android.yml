name: Build Memario APK

# Builds the Memario Android app on GitHub's Linux runners whenever the game changes.
# The installable APK is attached to each run (Actions tab -> the run -> Artifacts).

on:
  push:
    paths:
      - "memario/**"
      - ".github/workflows/memario-android.yml"
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The Android Gradle plugin fetches the platform and build tools it needs itself.
          packages: platform-tools

      - name: Build APK
        working-directory: memario/android
        run: |
          chmod +x gradlew
          # Maven Central sometimes rate-limits bursts of downloads; try again before failing.
          for attempt in 1 2 3; do
            ./gradlew assembleRelease --no-daemon --max-workers=2 && exit 0
            sleep $((attempt * 20))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memario-apk
          path: memario/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
