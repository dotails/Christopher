plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dotails.kaltoh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dotails.kaltoh'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '2.8.3'
        // Phones: ML Kit's face detector is native code, and only these two are worth carrying.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // Deliberately public, like a debug key: it only lets any build of this app install
        // over another (from this machine, CI, or Android Studio) without uninstalling first.
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'kaltoh-sideload'
            keyAlias 'kaltoh'
            keyPassword 'kaltoh-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Already-compressed assets gain nothing from zip compression.
        noCompress += ['jpg', 'bin', 'ttf']
    }

    packaging {
        // Native libraries compressed in the APK (unpacked on install): a much smaller download.
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Finding the player's face for the hologram: ML Kit's face detector, its model bundled in
    // the app so it works offline and without Google Play services.
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
