<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kal-toh</title>
<style>
  /* The Vulcan scripts, for the words carved into the underside of the base. */
  @font-face { font-family: 'VulcanScript'; src: url('assets/fonts/vulcan-script.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'ModernVulcan'; src: url('assets/fonts/modern-vulcan.ttf') format('truetype'); font-display: block; }

  html, body {
    margin: 0; height: 100%; overflow: hidden; color: #efe6dc;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Black above, deepening to red below. Nothing else is drawn on the screen. */
  body {
    background:
      radial-gradient(130% 60% at 50% 100%, rgba(150, 12, 8, 0.55) 0%, rgba(80, 4, 4, 0.25) 45%, rgba(0, 0, 0, 0) 75%),
      linear-gradient(to bottom, #000 0%, #030000 30%, #1c0202 62%, #4a0606 88%, #5e0808 100%);
    background-color: #000;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Only if the game cannot start at all. */
  #note { position: fixed; left: 24px; right: 24px; bottom: 40%; text-align: center; font: 15px/1.5 sans-serif; }
  #veil { position: fixed; inset: 0; background: #000; transition: opacity 1.4s ease; pointer-events: none; }
  #veil.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="note" hidden></div>
<div id="veil"></div>
<script>
  // three.js needs WebGL 2; say so plainly rather than show a blank screen.
  if (!document.createElement('canvas').getContext('webgl2')) {
    const note = document.getElementById('note');
    note.textContent = 'This device cannot draw WebGL 2. Update Android System WebView and try again.';
    note.hidden = false;
    document.getElementById('veil').classList.add('gone');
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
