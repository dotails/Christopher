<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kal-toh</title>
<style>
  @font-face { font-family: 'VulcanScript'; src: url('assets/fonts/vulcan-script.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'ModernVulcan'; src: url('assets/fonts/modern-vulcan.ttf') format('truetype'); font-display: block; }

  :root {
    --ink: #efe6dc;
    --dim: rgba(239, 230, 220, 0.5);
    --blue: #63c8ff;
    --inset-top: 0px;
    --inset-bottom: 0px;
    --under-base: 70%;
    --standard: 'Roboto', 'Helvetica Neue', system-ui, sans-serif;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Black above, deepening to red below. */
  body {
    background:
      radial-gradient(130% 60% at 50% 100%, rgba(150, 12, 8, 0.55) 0%, rgba(80, 4, 4, 0.25) 45%, rgba(0, 0, 0, 0) 75%),
      linear-gradient(to bottom, #000 0%, #030000 30%, #1c0202 62%, #4a0606 88%, #5e0808 100%);
    background-color: #000;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  #hud.ready { opacity: 1; }

  /* Translatable text: Vulcan and Standard stacked in one place; a wipe reveals one over the other. */
  .tr { display: inline-grid; justify-items: center; align-items: center; max-width: 100%; }
  .tr > .v, .tr > .s { grid-area: 1 / 1; white-space: nowrap; }
  .tr > .v { font-family: 'ModernVulcan'; letter-spacing: 0.04em; }
  .tr > .s { font-family: var(--standard); font-weight: 300; clip-path: inset(0 100% 0 0); }
  .show-s .tr > .v { clip-path: inset(0 0 0 100%); }
  .show-s .tr > .s { clip-path: none; }

  #crest {
    position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--inset-top) + 12px);
    text-align: center; pointer-events: auto; padding: 4px 18px 6px;
  }
  .tr.title > .v { font-family: 'VulcanScript'; font-size: 30px; letter-spacing: 0.3em; padding-left: 0.3em; opacity: 0.62; }
  .tr.title > .s { font-size: 12px; letter-spacing: 0.7em; padding-left: 0.7em; opacity: 0.6; }
  #minds { display: flex; gap: 18px; justify-content: center; margin-top: 10px; }
  #minds .seat { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 34px; transition: opacity 0.4s; }
  #minds .seat.out { opacity: 0.25; }
  #minds i {
    display: block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(239, 230, 220, 0.45);
    transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
  }
  #minds .seat.vulcan i { border-radius: 1px; transform: rotate(45deg); }
  #minds .seat.now i { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue); }
  #minds .score > .v { font-size: 11px; opacity: 0.7; }
  #minds .score > .s { font-size: 11px; opacity: 0.75; letter-spacing: 0.08em; }
  #minds.solo .seat.now i { background: transparent; border-color: rgba(239, 230, 220, 0.45); box-shadow: none; }

  #inscription {
    position: absolute; left: 14px; right: 14px; top: var(--under-base);
    text-align: center; pointer-events: auto; padding: 8px 0 14px;
  }
  #inscription .line { transition: opacity 0.6s ease; }
  #inscription .line.hidden { opacity: 0; }
  #inscription .line > .v { font-size: 20px; line-height: 1.3; opacity: 0.88; }
  #inscription .line > .s { font-size: 14px; line-height: 1.4; letter-spacing: 0.05em; opacity: 0.85; }
  #inscription.charged .line > .v { text-shadow: 0 0 12px var(--blue); }

  .glyph { position: absolute; width: 26px; height: 26px; padding: 10px; pointer-events: auto; opacity: 0.8; }
  .glyph::before, .glyph::after { content: ''; position: absolute; box-sizing: border-box; transition: border-color 0.4s, box-shadow 0.4s, background 0.4s; }
  /* The ways to play: a circle within a circle. */
  #gear { top: calc(var(--inset-top) + 14px); right: 12px; }
  #gear::before { left: 11px; top: 11px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(239, 230, 220, 0.45); }
  #gear::after { left: 19px; top: 19px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(239, 230, 220, 0.6); }
  /* The spin test: an arc with a point. */
  #spiral { top: calc(var(--inset-top) + 14px); left: 12px; display: none; }
  #spiral.available { display: block; }
  #spiral::before { left: 11px; top: 11px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(239, 230, 220, 0.5); border-right-color: transparent; }
  #spiral::after { left: 21px; top: 21px; width: 4px; height: 4px; border-radius: 50%; background: rgba(239, 230, 220, 0.6); }
  /* The hologram lens. */
  #lens { top: calc(var(--inset-top) + 62px); right: 12px; display: none; }
  #lens.available { display: block; }
  #lens::before { left: 11px; top: 11px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(239, 230, 220, 0.4); }
  #lens::after { left: 19px; top: 19px; width: 8px; height: 8px; border-radius: 50%; background: rgba(239, 230, 220, 0.4); }
  #lens.on::before { border-color: var(--blue); box-shadow: 0 0 8px rgba(99, 200, 255, 0.5); }
  #lens.on::after { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  #lens.starting::after { background: rgba(99, 200, 255, 0.5); }

  /* The ways to play and the rules: one page that translates as a whole when wiped. */
  #panel {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s ease;
    background: rgba(0, 0, 0, 0.82); overflow-y: auto; touch-action: pan-y;
  }
  #panel.open { opacity: 1; pointer-events: auto; }
  #panel .page { padding: calc(var(--inset-top) + 26px) 22px calc(var(--inset-bottom) + 40px); max-width: 560px; margin: 0 auto; }
  #panel .heading { text-align: center; margin: 4px 0 22px; }
  #panel .heading .tr > .v { font-size: 22px; }
  #panel .heading .tr > .s { font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; }
  #panel .row { margin: 0 0 16px; }
  #panel .label { margin-bottom: 7px; }
  #panel .label .tr > .v { font-size: 15px; opacity: 0.75; }
  #panel .label .tr > .s { font-size: 13px; opacity: 0.8; letter-spacing: 0.05em; }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #panel .chip {
    border: 1px solid rgba(239, 230, 220, 0.25); border-radius: 18px; padding: 7px 13px; cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
  }
  #panel .chip.on { border-color: var(--blue); box-shadow: 0 0 10px rgba(99, 200, 255, 0.35); background: rgba(99, 200, 255, 0.08); }
  #panel .chip .tr > .v { font-size: 15px; }
  #panel .chip .tr > .s { font-size: 13px; }
  #panel .tr, #panel .tr > .v, #panel .tr > .s { white-space: normal; text-align: left; justify-items: start; }
  #panel .para { margin: 0 0 14px; line-height: 1.45; }
  #panel .para .tr > .v { font-size: 15px; opacity: 0.85; }
  #panel .para .tr > .s { font-size: 14px; opacity: 0.9; }
  #panel .para.hint { margin-top: 26px; text-align: center; opacity: 0.6; }
  #panel .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  #panel .button { border: 1px solid rgba(239, 230, 220, 0.45); border-radius: 22px; padding: 10px 18px; cursor: pointer; }
  #panel .button .tr > .v { font-size: 16px; }
  #panel .button .tr > .s { font-size: 14px; letter-spacing: 0.08em; }

  #veil { position: fixed; inset: 0; background: #000; transition: opacity 1.4s ease; pointer-events: none; }
  #veil.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="crest">
    <div id="title"></div>
    <div id="minds" class="solo"></div>
  </div>
  <div id="spiral" class="glyph" role="button" aria-label="Test the spin"></div>
  <div id="gear" class="glyph" role="button" aria-label="Ways to play"></div>
  <div id="lens" class="glyph" role="button" aria-label="Hologram view"></div>
  <div id="inscription"></div>
</div>
<div id="panel"></div>
<div id="veil"></div>
<script>
  // three.js needs WebGL 2; say so plainly rather than show a blank screen.
  if (!document.createElement('canvas').getContext('webgl2')) {
    const box = document.getElementById('inscription');
    box.textContent = 'This device cannot draw WebGL 2. Update Android System WebView and try again.';
    box.style.fontFamily = 'sans-serif';
    document.getElementById('hud').classList.add('ready');
    document.getElementById('veil').classList.add('gone');
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
