<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kal-toh</title>
<style>
  @font-face { font-family: 'VulcanScript'; src: url('assets/fonts/vulcan-script.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'ModernVulcan'; src: url('assets/fonts/modern-vulcan.ttf') format('truetype'); font-display: block; }

  :root {
    --ink: #ece4d8;
    --blue: #59c6ff;
    --inset-top: 0px;
    --inset-bottom: 0px;
    --standard: 'Roboto', 'Helvetica Neue', system-ui, sans-serif;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #08090c; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  #hud.ready { opacity: 1; }

  #crest { position: absolute; left: 0; right: 0; top: calc(var(--inset-top) + 14px); text-align: center; }
  #title {
    font-family: 'VulcanScript'; font-size: 30px; line-height: 1; letter-spacing: 0.32em;
    padding-left: 0.32em; opacity: 0.58;
  }
  #title-standard {
    font-family: var(--standard); font-weight: 300; font-size: 9px; letter-spacing: 0.6em;
    padding-left: 0.6em; margin-top: 8px; opacity: 0.38;
  }
  #minds {
    pointer-events: auto; display: inline-flex; gap: 14px; margin-top: 12px; padding: 10px 16px;
  }
  #minds i {
    display: block; width: 7px; height: 7px; border-radius: 50%; border: 1px solid rgba(236, 228, 216, 0.45);
    transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
  }
  #minds i.now { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue); }
  #minds.solo i.now { background: transparent; border-color: rgba(236, 228, 216, 0.45); box-shadow: none; }

  #inscription {
    position: absolute; left: 18px; right: 18px; bottom: calc(var(--inset-bottom) + 20px);
    text-align: center; min-height: 58px;
  }
  .line { transition: opacity 0.7s ease; }
  .line.hidden { opacity: 0 !important; }
  #vulcan {
    font-family: 'ModernVulcan'; font-size: 21px; line-height: 1.25; letter-spacing: 0.04em; opacity: 0.86;
    white-space: nowrap; overflow: hidden;
  }
  #standard {
    font-family: var(--standard); font-weight: 300; font-size: 10.5px; line-height: 1.5;
    letter-spacing: 0.24em; text-transform: uppercase; margin-top: 7px; opacity: 0.55;
  }
  #inscription.charged #vulcan { text-shadow: 0 0 12px var(--blue); }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 75% at 50% 42%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  }
  #lens {
    position: absolute; top: calc(var(--inset-top) + 16px); right: 14px; width: 26px; height: 26px;
    padding: 10px; pointer-events: auto; display: none;
  }
  #lens.available { display: block; }
  #lens::before {
    content: ''; display: block; width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box;
    border: 1px solid rgba(236, 228, 216, 0.4); transition: border-color 0.4s, box-shadow 0.4s;
  }
  #lens::after {
    content: ''; position: absolute; left: 18px; top: 18px; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(236, 228, 216, 0.4); transition: background 0.4s, box-shadow 0.4s;
  }
  #lens.on::before { border-color: var(--blue); box-shadow: 0 0 8px rgba(89, 198, 255, 0.5); }
  #lens.on::after { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  #lens.starting::after { background: rgba(89, 198, 255, 0.5); }
  #veil { position: fixed; inset: 0; background: #08090c; transition: opacity 1.4s ease; pointer-events: none; }
  #veil.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="crest">
    <div id="title">kaltoh</div>
    <div id="title-standard">KAL-TOH</div>
    <div id="minds" class="solo" role="button" aria-label="Number of players"></div>
  </div>
  <div id="lens" role="button" aria-label="Hologram view"></div>
  <div id="inscription">
    <div id="vulcan" class="line"></div>
    <div id="standard" class="line"></div>
  </div>
</div>
<div id="veil"></div>
<script>
  // three.js needs WebGL 2; say so plainly rather than show a blank screen.
  if (!document.createElement('canvas').getContext('webgl2')) {
    document.getElementById('standard').textContent = 'This device cannot draw WebGL 2. Update Android System WebView and try again.';
    document.getElementById('hud').classList.add('ready');
    document.getElementById('veil').classList.add('gone');
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
