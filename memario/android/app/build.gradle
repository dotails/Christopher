plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dotails.memario'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dotails.memario'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '5.3.0'
    }

    signingConfigs {
        // Deliberately public, like a debug key: it only lets any build of this app install
        // over another (from this machine, CI, or Android Studio) without uninstalling first.
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'memario-sideload'
            keyAlias 'memario'
            keyPassword 'memario-sideload'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Already-compressed assets gain nothing from zip compression.
        noCompress += ['woff2', 'png', 'ogg']
    }
}
