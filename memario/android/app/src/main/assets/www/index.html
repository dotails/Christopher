<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Memario</title>
<style>
@font-face{font-family:'Silkscreen';src:url(fonts/silkscreen.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jbmono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jbmono-700.woff2) format('woff2');font-weight:700;font-display:swap}
/* Layout. Portrait: game screen edge to edge on top, register screen filling the space between it and
   the controller. Landscape and desktop (Switch-style): one big game screen with a slim register strip
   under it, controller halves either side. Script sizes both screens; nothing scrolls. */
:root{
  --void:#08070f; --term:#0d0b18; --term2:#151229; --rule:#262046;
  --ink:#e8fff2; --muted:#8a93b4; --phos:#39ff88; --phos-dim:#1d5c3c; --hot:#ff3d8a; --cyan:#4ff0ff; --gold:#ffc23d;
  /* controller shell (matched to the reference handheld) */
  --shell:#28276b; --shell-hi:#302f78; --well:#22215e; --well-ring:#2e2d72; --well-deep:#1b1a50;
  --lav:#c9c8e8; --lav-hi:#dddcf3; --lav-lo:#a9a8d0; --arrow:#6f6d9e;
  --bx:#2457d6; --by:#28a647; --ba:#d42626; --bb:#e6b412;
  --f-pix:'Silkscreen','Courier New',monospace;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-btn:ui-rounded,'SF Pro Rounded','Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:dark;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-mono);font-size:13px;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.kfocus{outline:3px solid var(--gold)!important;outline-offset:2px;box-shadow:0 0 12px rgba(255,194,61,.6)!important}

.app{height:100%;display:flex;flex-direction:column;background:var(--shell);padding-top:var(--sat)}

/* ---------- overlays: title, level cards, menu, results ---------- */
.ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(8,7,15,.78);padding:14px 16px;overflow:auto;text-align:center}
.ov-box{display:grid;gap:10px;justify-items:center;max-width:540px}
.ov h2{font-family:var(--f-pix);font-weight:400;font-size:clamp(30px,10cqw,68px);line-height:1;margin:0;color:#fff;
  text-shadow:3px 0 var(--hot),-3px 0 var(--cyan);letter-spacing:.02em}
.ov p{margin:0;color:#cdd6ea;font-size:clamp(11px,2.6cqw,14px);line-height:1.45;text-wrap:balance;max-width:44ch}
.ov .steps{margin:0;padding:0 0 0 1.4em;text-align:left;display:grid;gap:4px;color:#cdd6ea;font-size:clamp(10px,2.3cqw,13px);line-height:1.4;max-width:46ch}
.ov .steps b{color:var(--phos);font-weight:700}
.ov .act{font-family:var(--f-pix);font-size:16px;background:var(--phos);color:#04130a;border:0;padding:10px 22px;border-radius:4px;cursor:pointer}
.ov .act.alt{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.ov .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov dl{display:grid;grid-template-columns:auto auto;gap:4px 18px;margin:0;font-size:12px;text-align:left}
.ov dt{color:var(--muted)} .ov dd{margin:0;color:#fff;font-variant-numeric:tabular-nums}
.ov .rank{font-family:var(--f-pix);color:var(--gold);font-size:18px}
.ov .lvl{font-family:var(--f-pix);color:var(--cyan);font-size:clamp(11px,3cqw,15px);letter-spacing:.1em}
.ov h2.lt{font-size:clamp(22px,7.5cqw,52px)}
.ov .hk{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-family:var(--f-pix);font-size:clamp(9px,2.4cqw,12px);max-width:46ch}
.ov .hk .g{color:var(--phos)} .ov .hk .b{color:var(--hot)}
@container (max-height:290px){ .ov .steps,.ov .hide-short{display:none} .ov h2{font-size:clamp(26px,9cqw,44px)} }

/* ---------- the two screens ---------- */
.screens{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;background:#000}
.scr{position:relative;flex:0 0 auto;width:100%;background:#000;overflow:hidden;container-type:size}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
#stage2{border-top:2px solid #05040a}
#cv2{cursor:pointer}
.ov .steps{display:none}
body.mode-switch .ov .steps{display:grid}

/* ---------- handheld controller ---------- */
.pad{flex:0 0 auto;--w:min(calc((100vw - 40px)/2.7),19vh,210px);position:relative;background:var(--shell);
  box-shadow:inset 0 1px 0 var(--shell-hi);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;touch-action:none;
  padding-top:14px;padding-bottom:calc(10px + var(--sab));
  padding-left:max(12px,var(--sal));padding-right:max(12px,var(--sar))}
.pad *{touch-action:none}
.pad-l,.pad-r{display:grid;gap:10px;justify-items:center}
.pad-m{display:grid;grid-template-rows:var(--w) calc(var(--w)*1.1 + 10px);justify-items:center;min-width:calc(var(--w)*.6);position:relative;z-index:2}
.well{width:var(--w);height:var(--w);border-radius:50%;position:relative;
  background:radial-gradient(circle,var(--well) 60%,#24236a 100%);box-shadow:0 0 0 3px var(--well-ring),inset 0 2px 8px rgba(0,0,0,.25)}
/* D-pad */
.dpad{position:absolute;inset:0;cursor:pointer}
.dpad .cross{position:absolute;inset:14%;width:72%;height:72%;overflow:visible;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.dpad .hub{position:absolute;left:43%;top:43%;width:14%;height:14%;border-radius:50%;background:radial-gradient(circle,#a6a5cc,#b4b3d8)}
.dpad .ar{position:absolute;width:0;height:0;border:calc(var(--w)*.035) solid transparent;transition:border-color .06s}
.dpad .ar.u{left:50%;top:21%;transform:translate(-50%,-50%);border-bottom:calc(var(--w)*.05) solid var(--arrow);border-top-width:0}
.dpad .ar.d{left:50%;top:79%;transform:translate(-50%,-50%);border-top:calc(var(--w)*.05) solid var(--arrow);border-bottom-width:0}
.dpad .ar.l{top:50%;left:21%;transform:translate(-50%,-50%);border-right:calc(var(--w)*.05) solid var(--arrow);border-left-width:0}
.dpad .ar.r{top:50%;left:79%;transform:translate(-50%,-50%);border-left:calc(var(--w)*.05) solid var(--arrow);border-right-width:0}
.dpad.on-l .ar.l{border-right-color:var(--hot)} .dpad.on-r .ar.r{border-left-color:var(--hot)}
.dpad.on-d .ar.d{border-top-color:var(--hot)} .dpad.on-u .ar.u{border-bottom-color:var(--hot)}
.dpad.on-l{transform:perspective(300px) rotateY(-7deg)} .dpad.on-r{transform:perspective(300px) rotateY(7deg)}
.dpad.on-d{transform:perspective(300px) rotateX(7deg)}
/* face buttons */
.fb{position:absolute;width:27%;height:27%;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;
  font:300 calc(var(--w)*.15)/1 var(--f-btn);box-shadow:0 4px 0 rgba(0,0,0,.28),0 6px 10px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25)}
.fb.x{left:36.5%;top:9%;background:radial-gradient(circle at 45% 35%,#4a7cf0,var(--bx) 65%);color:#163a96}
.fb.y{left:9%;top:36.5%;background:radial-gradient(circle at 45% 35%,#f7d046,#e6b412 65%);color:#7a5a05}
.fb.a{left:64%;top:36.5%;background:radial-gradient(circle at 45% 35%,#47c766,#28a647 65%);color:#145c26}
.fb.b{left:36.5%;top:64%;background:radial-gradient(circle at 45% 35%,#ee4a4a,#d42626 65%);color:#7d1010}
.fb.down,.small.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.2);filter:brightness(1.15)}
.fb.b.armed{box-shadow:0 0 0 3px var(--cyan),0 4px 0 rgba(0,0,0,.28)}
.led{position:absolute;pointer-events:none;right:max(0px,var(--sar));width:10px;border-radius:3px 0 0 3px}
.led.r1{top:calc(14px + var(--w)*.18);height:26px;background:#5a1420;box-shadow:none;transition:background .1s}
.led.r1.on{background:#ff2a3a;box-shadow:0 0 10px #ff2a3a}
.led.r2{top:calc(14px + var(--w)*.18 + 34px);height:24px;background:#1f1e55;transition:background .2s}
/* grille + small buttons */
.grille{align-self:end;justify-self:center;display:grid;grid-template-columns:repeat(4,7px);gap:calc(var(--w)*.075) calc(var(--w)*.06);margin-bottom:calc(var(--w)*-.18)}
.grille i{width:7px;height:7px;border-radius:50%;background:#18174a}
.smalls{align-self:end;justify-self:center;display:flex;gap:4px;margin-bottom:0}
.swell{width:calc(var(--w)*.36);height:calc(var(--w)*.36);border-radius:50%;background:var(--well-deep);display:grid;place-items:center;box-shadow:0 0 0 2px var(--well-ring)}
.small{width:66%;height:66%;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 40% 35%,var(--lav-hi),var(--lav) 60%,var(--lav-lo));
  box-shadow:0 3px 6px rgba(0,0,0,.35)}
/* analog sticks */
.stickw{width:calc(var(--w)*1.04);height:calc(var(--w)*1.04);box-shadow:0 0 0 3px var(--well-ring)}
.stick{position:absolute;inset:0;border-radius:50%;cursor:grab}
.stick .gate{position:absolute;inset:16%;border-radius:50%;background:var(--well-deep)}
.stick .cap{position:absolute;left:50%;top:50%;width:52%;height:52%;margin:-26% 0 0 -26%;border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#e4e3f6,var(--lav) 55%,#a5a4cc);box-shadow:0 6px 12px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.12);
  will-change:transform}
.stick .cap::after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,255,255,.18)}

/* ---------- keyboard-only screens: no controller ---------- */
body:not(.touch) .pad{display:none}
@media (min-width:820px){ .pad{--w:min(150px,17vh)} }
/* ---------- phone held sideways: controller halves flank the screens ---------- */
@media (orientation:landscape) and (max-height:560px){
  .app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto}
  .screens{grid-column:2;grid-row:1/span 2}
  .pad{display:contents;--w:min(23vh,21vw,150px)}
  .pad-m,.smalls{display:contents} .grille{display:none}
  .swell{width:calc(var(--w)*.46);height:calc(var(--w)*.46);align-self:center;justify-self:center;margin-bottom:max(6px,var(--sab))}
  .swell:first-child{grid-column:1;grid-row:2} .swell:last-child{grid-column:3;grid-row:2}
  .pad-l,.pad-r{grid-row:1;align-content:space-evenly;padding-inline:max(10px,var(--sal)) 10px;gap:6px}
  .pad-l{grid-column:1} .pad-r{grid-column:3;padding-inline:10px max(14px,var(--sar));position:relative}
  .stickw{width:calc(var(--w)*.95);height:calc(var(--w)*.95)}
  .led{display:none}
}
@media (prefers-reduced-motion:reduce){ .dpad{transform:none!important} }
/* ---------- title menu, saves, settings ---------- */
.ov.clear{background:transparent}
.ov.clear h2,.ov.clear p{text-shadow:0 2px 0 #000,0 0 8px #000}
.ov .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,360px)}
.ov .menu .act{width:100%}
.ov .menu.learn{max-height:54cqh;overflow:auto}
.ov .menu.learn .act{font-size:12px;padding:8px 6px}
.ov .note{font-size:11px;color:var(--muted)}
.ov .saves{display:grid;gap:6px;width:min(100%,440px);max-height:58cqh;overflow:auto;text-align:left}
.ov .save{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:var(--term2);border:1px solid var(--rule);padding:6px 8px;border-radius:4px}
.ov .save b{font-family:var(--f-pix);font-weight:400;color:#fff} .ov .save span{color:var(--muted);font-size:11px}
.ov .save .act{padding:6px 10px;font-size:12px}
.ov .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,380px)}
.ov .opts .act{width:100%;font-size:13px}
.ov .opts span{display:block}
.ov .opts .act.on{border-color:var(--phos);color:var(--phos)}
body.mode-stack .ov .only-wide,body.mode-side .ov .only-wide{display:none}
body.mode-side .screens{flex-direction:row;align-items:stretch}
body.mode-side #stage2{border-top:0;border-left:2px solid #05040a}
/* ---------- the hack tool: every hack, searchable; tap to bring it with you ---------- */
.tool{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:#0a0816;font-family:var(--f-pix);color:var(--ink);user-select:none}
body.mode-switch:not(.mode-side) .tool{position:fixed;inset:var(--sat) 0 0 0;z-index:30}
.tool .tscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;margin-right:38px;scrollbar-width:none}
.tool .tscroll::-webkit-scrollbar{display:none}
.tool .tmap{position:absolute;left:auto;right:0;top:0;bottom:auto;width:38px;height:100%;background:#07060f;border-left:1px solid var(--rule);touch-action:none;cursor:pointer}
.tool .tbar #tDone{position:static;flex:0 0 auto}
.tool #tDone{position:absolute;right:6px;top:6px;font:13px var(--f-pix);background:var(--phos);color:#04130a;border:0;border-radius:4px;padding:7px 12px}
.tool .xhead{font-size:11px;color:var(--cyan);padding:7px 8px 3px;letter-spacing:.08em}
.tool .tbar{display:flex;gap:6px;padding:6px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:2;background:#0a0816}
.tool input{flex:1;min-width:0;font:14px var(--f-pix);background:#05040a;color:#fff;border:1px solid var(--cyan);border-radius:4px;padding:7px 9px;user-select:text;-webkit-user-select:text}
.tool input::placeholder{color:#4a5a7a}
.tool .tcats{display:flex;gap:5px;padding:5px 6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.tool .tcats button{flex:0 0 auto;font:11px var(--f-pix);background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:10px;padding:3px 9px}
.tool .tcats button.on{color:#04130a;background:var(--cyan);border-color:var(--cyan)}
.tool .tlist{padding:0 0 10px}
.tool .hk.lock{opacity:.38;filter:grayscale(1)}
.tool .hk.lvl{border-style:dashed}
.tool .hk{display:grid;grid-template-columns:auto 1fr auto;column-gap:6px;row-gap:4px;align-items:center;text-align:left;background:var(--term2);border:1px solid var(--rule);border-radius:4px;padding:5px 7px;cursor:pointer}
.tool .hk .d{grid-column:2/4;grid-row:1;font:700 11px/1.25 var(--f-mono);color:#e8ecff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tool .hk.b .d{color:#ffb3d1}
.tool .hk .lv{grid-column:1;grid-row:1;justify-self:center;align-self:start;font-size:10px;line-height:1.5;color:var(--muted)}
.tool .hk .c{grid-column:1;grid-row:2;width:17px;height:17px;border-radius:50%;background:#2b2858;display:grid;place-items:center;color:#fff;font:10px/1 var(--f-pix)}
.tool .hk .c.jump{background:#28a647}
.tool .hk .c.left::before,.tool .hk .c.right::before{content:'';width:0;height:0;border:4px solid transparent}
.tool .hk .c.left::before{border-right:6px solid #fff;border-left:0;margin-right:2px}
.tool .hk .c.right::before{border-left:6px solid #fff;border-right:0;margin-left:2px}
.tool .hk .s{grid-column:2/4;grid-row:2;font:13px/1 var(--f-pix);white-space:nowrap;overflow:hidden;color:#8f97c0}
.tool .hk .s i{font-style:normal;margin-right:.4em;display:inline-block}
.tool .hk .s i.w{color:var(--phos)} .tool .hk.b .s i.w{color:var(--hot)}
.tool .hk .s i.nx{color:var(--cyan);font-size:1.3em}
.tool .hk.m{border-color:var(--phos);box-shadow:0 0 0 1px var(--phos),0 0 10px rgba(57,255,136,.35)}
.tool .hk.b.m{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 10px rgba(255,61,138,.35)}
.tool .hk.m .s i.nx{color:#fff;text-shadow:0 0 6px var(--phos)} .tool .hk.b.m .s i.nx{text-shadow:0 0 6px var(--hot)}
.tool .hk.on{border-color:var(--phos);background:#0d2a1a} .tool .hk.on .lv{color:var(--phos)}
.tool .hk.b.on{border-color:var(--hot);background:#2a0d1c} .tool .hk.b.on .lv{color:var(--hot)}
.tool .hk.live .s i{color:var(--phos)} .tool .hk.b.live .s i{color:var(--hot)}
.tool .rows{display:grid;gap:4px;padding:0 4px 4px}
.tool .prow{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px;border-radius:6px;border:1px solid transparent}
.tool .prow.on{border-color:#3c4a78;background:rgba(255,255,255,0.03)}
.tool .prow.on .hk.g{background:#0e3b20;border-color:var(--phos)}
.tool .prow.on .hk.b{background:#3d0e24;border-color:var(--hot)}
.tool .prow.on .hk.lock{opacity:1;filter:none}
.tool .hk.none{border-style:dashed;background:transparent;opacity:.35;cursor:default;min-height:44px}
.tool .sec{font-size:10px;color:var(--cyan);padding:7px 8px 4px;letter-spacing:.08em}
/* while playing the digits are the big bold line; paused or on the title, the description is */
.tool.playing .tbar{position:static}
.tool.playing .hk .s{font-size:16px}
.tool.playing .hk .s i{margin-right:.28em}
body.mode-side .tool.playing .hk .s{font-size:14px}
.tool.playing .hk .d{font-weight:400;font-size:10px;color:#a9b2d2}
.tool:not(.playing) .hk .d{font:400 13px/1.2 var(--f-pix);color:#fff}
.tool:not(.playing) .hk.b .d{color:#ffb3d1}
.tool:not(.playing) .hk .s{font-size:12px}
/* screen 2 during a level: the memory row on top, the list under it */
#stage2.listmode #cv2{bottom:auto;height:var(--memh,0px)}
#stage2.listmode:not(.withrow) #cv2{display:none}
#stage2.listmode .tool{top:var(--memh,0px)}
#stage2.listmode:not(.withrow) .tool{top:0}
.tool .tfoot{position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding:6px 8px;border-top:1px solid var(--gold);background:rgba(10,8,22,.94);font-size:11px;color:var(--gold);transition:opacity .4s}
.tool .tfoot.quiet{opacity:0}
.tool .empty{grid-column:1/3;color:var(--muted);font-size:12px;padding:10px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="screens" id="screens">
    <div class="scr" id="stage">
      <canvas id="cv" width="320" height="240" aria-label="Memario game screen"></canvas>
      <div class="ov" id="ov"><div class="ov-box" id="ovBox"></div></div>
    </div>
    <div class="scr" id="stage2">
      <canvas id="cv2" width="320" height="240" aria-label="Memory row and registers. Drag to scroll; tap a register to have it explained."></canvas>
      <div class="tool" id="tool" hidden>
        <div class="tscroll" id="tscroll">
          <div id="tact"></div>
          <div class="tbar"><input id="tq" type="search" placeholder="SEARCH EVERY HACK" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search hacks"><button id="tDone">DONE</button></div>
          <div class="tcats" id="tcats"></div>
          <div class="xhead" id="xhead"></div>
          <div class="tlist" id="tlist"></div>
        </div>
        <canvas class="tmap" id="tmap" aria-label="Overview of the list: white is available, green is active. Tap or drag to scroll."></canvas>
        <div class="tfoot" id="tfoot"></div>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="pad-l">
      <div class="well"><div class="dpad" id="dpad" aria-label="D-pad">
        <svg class="cross" viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="dpadFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dddcf3"/><stop offset=".55" stop-color="#c9c8e8"/><stop offset="1" stop-color="#a9a8d0"/></linearGradient></defs>
          <path fill="url(#dpadFill)" d="M36 7Q36 0 43 0H57Q64 0 64 7V36H93Q100 36 100 43V57Q100 64 93 64H64V93Q64 100 57 100H43Q36 100 36 93V64H7Q0 64 0 57V43Q0 36 7 36H36Z"/>
        </svg><div class="hub"></div>
        <i class="ar u"></i><i class="ar d"></i><i class="ar l"></i><i class="ar r"></i>
      </div></div>

/* ================= audio ================= */
let actx = null, muted = false;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  if (actx) decodeSong();
}
function tone(f, d, type = 'square', v = 0.05, slide = 0, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.05) {
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate * d), b = actx.createBuffer(1, n, actx.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain(); s.buffer = b; g.gain.value = v; s.connect(g).connect(actx.destination); s.start();
}
const SFX = {
  jump: () => tone(260, 0.12, 'square', 0.04, 300),
  bump: () => tone(120, 0.07, 'square', 0.05, -50),
  stomp: () => tone(240, 0.09, 'square', 0.05, -160),
  bit: () => { tone(1046, 0.05, 'square', 0.03); tone(1568, 0.08, 'square', 0.03, 0, 0.05); },
  ok: () => { tone(660, 0.06, 'square', 0.04); tone(990, 0.09, 'square', 0.04, 0, 0.06); },

function renderTool() {

// The minimap: the whole list in miniature down the right edge. White: available. Green: active. Grey: locked.

function drawMap() {

$('tscroll').addEventListener('scroll', () => requestAnimationFrame(drawMap), { passive: true });
addEventListener('resize', () => requestAnimationFrame(drawMap));
{ let mapDrag = null;
  const go = (e) => { const rc = $('tmap').getBoundingClientRect(), sc = $('tscroll'); sc.scrollTop = (e.clientY - rc.top) / rc.height * sc.scrollHeight - sc.clientHeight / 2; };
  $('tmap').addEventListener('pointerdown', (e) => { e.preventDefault(); mapDrag = e.pointerId; try { $('tmap').setPointerCapture(e.pointerId); } catch (_) { /* fine */ } go(e); });

}
$('tq').addEventListener('input', () => { titleAt = frame; renderTool(); });

for (const id of ['tlist', 'tact']) $(id).addEventListener('click', (e) => { const b = e.target.closest('.hk'); if (b) { ensureAudio(); toggleSet(b.dataset.id); SFX.click(); haptic(); renderTool(); } });

/* ================= sizing & loop ================= */
const screensEl = $('screens'), stageEl = $('stage'), stage2El = $('stage2');
VW = 320; cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
function resize() {
  const W = screensEl.clientWidth, H = screensEl.clientHeight;
  if (W < 20 || H < 20) return;
  const stack = innerHeight > innerWidth * 1.05;
  document.body.classList.toggle('mode-stack', stack);
  document.body.classList.toggle('mode-switch', !stack);

    const memMin = Math.ceil(W / 320 * 172);

  } else if (side) {

let last = performance.now(), acc = 0;
