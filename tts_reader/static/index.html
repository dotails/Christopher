<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>TTS Reader</title>
  <meta name="theme-color" content="#16161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reader">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <select id="voice" aria-label="Voice"></select>
    <label class="speed">
      <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Speed">
      <output id="speedOut">1.00×</output>
    </label>
    <button id="edit" class="icon" title="Edit text" aria-label="Edit text" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
    </button>
    <button id="menu" class="icon" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main>
    <div id="editor">
      <div class="toolbar">
        <button id="openFile" class="pill">Open file</button>
        <button id="paste" class="pill">Paste</button>
        <button id="clear" class="pill">Clear</button>
        <input id="filePicker" type="file" accept=".txt,.md,.markdown,.html,.htm,text/plain,text/markdown,text/html" hidden>
      </div>
      <textarea id="text" placeholder="Paste or type text here, or open a file, then press play.&#10;&#10;Blank lines separate paragraphs." spellcheck="false"></textarea>
    </div>
    <div id="reader" hidden></div>
  </main>

  <footer>
    <div id="progress" role="slider" aria-label="Position in text" tabindex="0"><div id="progressFill"></div></div>
    <div id="status" aria-live="polite"></div>
    <div class="controls">
      <button id="prev" class="icon" aria-label="Previous paragraph">
        <svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg>
      </button>
      <button id="play" class="icon big" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/></svg>
        <span class="spinner"></span>
      </button>
      <button id="next" class="icon" aria-label="Next paragraph">
        <svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg>
      </button>
    </div>
  </footer>

  <div id="sheet" hidden>
    <div class="backdrop" data-close></div>
    <section class="panel" role="dialog" aria-label="Menu">
      <div class="grab" data-close></div>

      <h2>Recent</h2>
      <ul id="recent"></ul>

      <h2>Sleep timer</h2>
      <div class="chips" id="sleep">
        <button data-min="0">Off</button>
        <button data-min="15">15 min</button>
        <button data-min="30">30 min</button>
        <button data-min="45">45 min</button>
        <button data-min="60">1 hour</button>
      </div>

      <h2>Text size</h2>
      <div class="row">
        <button id="smaller" class="pill">A−</button>
        <span id="sizeOut">100%</span>
        <button id="larger" class="pill">A+</button>
      </div>

      <h2>Recording</h2>
      <label class="toggle"><input id="autosave" type="checkbox" checked> Save to Downloads automatically when it's all ready</label>
      <button id="saveNow" class="pill wide">Save recording now</button>

      <h2>Reading</h2>
      <label class="toggle"><input id="clean" type="checkbox" checked> Skip web links, Markdown symbols and citation numbers like [12]</label>

      <p class="about">Voices: Kokoro-82M (Apache-2.0) · Australian voices: piper-en_AU-librivox-medium by DataCraftsmanAustralia, from LibriVox recordings (CC BY 4.0) · Speech engine: sherpa-onnx.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
